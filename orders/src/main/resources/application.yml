spring:
  application:
    name: orders
  datasource:
    url: jdbc:postgresql://localhost:5555/systemOrders
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    jpa:
      database-platform: org.hibernate.dialect.PostgreSQLDialect
      hibernate:
        ddl-auto: none
      show-sql: true
      properties:
        hibernate:
          format_sql: true

server:
  port: 8080

salesManager:
  orders:
    clients:
      products:
        url: 'http://localhost:8081'
      clients:
        url: 'http://localhost:8082'
  config:
    kafka:
      server-url: 'localhost:9092'
      topics:
        paid-orders: 'paid-orders'
        invoiced-orders: 'invoiced-orders'
        orders-sent: 'orders-sent'
